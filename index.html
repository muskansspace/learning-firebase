<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Sign in or create your account." />
  <title>Welcome — Login & Sign Up</title>
  <link rel="stylesheet" href="index.css" />
</head>
<body>

  <!-- ── Animated Background ──────────────────────── -->
  <div class="bg-canvas">
    <div class="orb orb--1"></div>
    <div class="orb orb--2"></div>
    <div class="orb orb--3"></div>
  </div>

  <!-- ── Auth Card ────────────────────────────────── -->
  <main class="login-wrapper">
    <div class="login-card">

      <!-- Logo -->
      <div class="logo-container">
        <div class="logo-circle">
          <svg viewBox="0 0 24 24">
            <path d="M12 2L2 7l10 5 10-5-10-5z" />
            <path d="M2 17l10 5 10-5" />
            <path d="M2 12l10 5 10-5" />
          </svg>
        </div>
      </div>

      <h1 class="login-title">Welcome</h1>
      <p class="login-subtitle" id="subtitleText">Sign in to continue to your account</p>

      <!-- ── Tab Switcher ─────────────────────────── -->
      <div class="tab-bar" role="tablist">
        <button class="tab-btn active" id="tabLogin" role="tab" aria-selected="true" data-tab="login">Login</button>
        <button class="tab-btn" id="tabSignup" role="tab" aria-selected="false" data-tab="signup">Sign Up</button>
        <div class="tab-indicator" id="tabIndicator"></div>
      </div>

      <!-- ── Panels Container ─────────────────────── -->
      <div id="authMessage" style="display:none"></div>
      <div class="panels-viewport">
        <div class="panels-slider" id="panelsSlider">

          <!-- ===== LOGIN PANEL ===== -->
          <div class="panel" id="panelLogin">
            <form id="loginForm" autocomplete="on" novalidate>

              <!-- Email -->
              <div class="form-group">
                <label for="loginEmail">Email</label>
                <div class="input-wrapper">
                  <svg class="input-icon" viewBox="0 0 24 24">
                    <rect x="2" y="4" width="20" height="16" rx="3" />
                    <path d="M22 4l-10 8L2 4" />
                  </svg>
                  <input
                    type="email"
                    id="loginEmail"
                    name="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required
                  />
                </div>
              </div>

              <!-- Password -->
              <div class="form-group">
                <label for="loginPassword">Password</label>
                <div class="input-wrapper">
                  <svg class="input-icon" viewBox="0 0 24 24">
                    <rect x="3" y="11" width="18" height="11" rx="3" />
                    <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                  </svg>
                  <input
                    type="password"
                    id="loginPassword"
                    name="password"
                    placeholder="••••••••"
                    autocomplete="current-password"
                    required
                  />
                  <button type="button" class="toggle-password" aria-label="Toggle password visibility" data-target="loginPassword">
                    <svg class="eye-open" viewBox="0 0 24 24">
                      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z" />
                      <circle cx="12" cy="12" r="3" />
                    </svg>
                    <svg class="eye-closed" viewBox="0 0 24 24" style="display:none">
                      <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" />
                      <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" />
                      <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24" />
                      <line x1="1" y1="1" x2="23" y2="23" />
                    </svg>
                  </button>
                </div>
              </div>

              <!-- Extras -->
              <div class="form-extras">
                <label class="remember-me">
                  <input type="checkbox" id="rememberMe" name="remember" />
                  <span>Remember me</span>
                </label>
                <a href="#" class="forgot-link" id="forgotPasswordLink">Forgot password?</a>
              </div>

              <!-- Submit -->
              <button type="submit" class="btn-primary" id="loginButton">Sign In</button>
            </form>

            <!-- Divider -->
            <div class="divider"><span>or</span></div>

            <!-- Social Login -->
            <div class="social-row">
              <button class="btn-social" id="googleLogin" type="button">
                <svg viewBox="0 0 24 24">
                  <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
                  <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                  <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                  <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                </svg>
                Google
              </button>

            </div>
          </div>
          <!-- end login panel -->

          <!-- ===== SIGNUP PANEL ===== -->
          <div class="panel" id="panelSignup">
            <form id="signupForm" autocomplete="on" novalidate>

              <!-- Full Name -->
              <div class="form-group">
                <label for="signupName">Full Name</label>
                <div class="input-wrapper">
                  <svg class="input-icon" viewBox="0 0 24 24">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                    <circle cx="12" cy="7" r="4" />
                  </svg>
                  <input
                    type="text"
                    id="signupName"
                    name="name"
                    placeholder="John Doe"
                    autocomplete="name"
                    required
                  />
                </div>
              </div>

              <!-- Email -->
              <div class="form-group">
                <label for="signupEmail">Email</label>
                <div class="input-wrapper">
                  <svg class="input-icon" viewBox="0 0 24 24">
                    <rect x="2" y="4" width="20" height="16" rx="3" />
                    <path d="M22 4l-10 8L2 4" />
                  </svg>
                  <input
                    type="email"
                    id="signupEmail"
                    name="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required
                  />
                </div>
              </div>

              <!-- Password -->
              <div class="form-group">
                <label for="signupPassword">Password</label>
                <div class="input-wrapper">
                  <svg class="input-icon" viewBox="0 0 24 24">
                    <rect x="3" y="11" width="18" height="11" rx="3" />
                    <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                  </svg>
                  <input
                    type="password"
                    id="signupPassword"
                    name="password"
                    placeholder="••••••••"
                    autocomplete="new-password"
                    required
                  />
                  <button type="button" class="toggle-password" aria-label="Toggle password visibility" data-target="signupPassword">
                    <svg class="eye-open" viewBox="0 0 24 24">
                      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z" />
                      <circle cx="12" cy="12" r="3" />
                    </svg>
                    <svg class="eye-closed" viewBox="0 0 24 24" style="display:none">
                      <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" />
                      <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" />
                      <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24" />
                      <line x1="1" y1="1" x2="23" y2="23" />
                    </svg>
                  </button>
                </div>
              </div>

              <!-- Confirm Password -->
              <div class="form-group">
                <label for="signupConfirmPassword">Confirm Password</label>
                <div class="input-wrapper">
                  <svg class="input-icon" viewBox="0 0 24 24">
                    <rect x="3" y="11" width="18" height="11" rx="3" />
                    <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                    <circle cx="12" cy="16" r="1" />
                  </svg>
                  <input
                    type="password"
                    id="signupConfirmPassword"
                    name="confirmPassword"
                    placeholder="••••••••"
                    autocomplete="new-password"
                    required
                  />
                </div>
              </div>

              <!-- Terms -->
              <div class="form-extras">
                <label class="remember-me">
                  <input type="checkbox" id="agreeTerms" name="terms" required />
                  <span>I agree to the <a href="#" class="forgot-link">Terms</a></span>
                </label>
              </div>

              <!-- Submit -->
              <button type="submit" class="btn-primary" id="signupButton">Create Account</button>
            </form>

            <!-- Divider -->
            <div class="divider"><span>or</span></div>

            <!-- Social Sign Up -->
            <div class="social-row">
              <button class="btn-social" id="googleSignup" type="button">
                <svg viewBox="0 0 24 24">
                  <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
                  <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                  <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                  <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                </svg>
                Google
              </button>

            </div>
          </div>
          <!-- end signup panel -->

        </div>
      </div>
      <!-- end panels viewport -->

    </div>
  </main>

  <!-- ── Script ───────────────────────────────────── -->
  <script type="module" src="./dist/bundle.js"></script>
  <script>
    // ── Tab switching ──────────────────────────────
    const tabLogin     = document.getElementById('tabLogin');
    const tabSignup    = document.getElementById('tabSignup');
    const indicator    = document.getElementById('tabIndicator');
    const slider       = document.getElementById('panelsSlider');
    const subtitle     = document.getElementById('subtitleText');

    function switchTab(tab) {
      const isLogin = tab === 'login';

      // Update active tab
      tabLogin.classList.toggle('active', isLogin);
      tabSignup.classList.toggle('active', !isLogin);
      tabLogin.setAttribute('aria-selected', isLogin);
      tabSignup.setAttribute('aria-selected', !isLogin);

      // Slide indicator
      indicator.style.left = isLogin ? '4px' : '50%';

      // Slide panels
      slider.style.transform = isLogin ? 'translateX(0)' : 'translateX(-50%)';

      // Update subtitle
      subtitle.textContent = isLogin
        ? 'Sign in to continue to your account'
        : 'Create an account to get started';
    }

    tabLogin.addEventListener('click', () => switchTab('login'));
    tabSignup.addEventListener('click', () => switchTab('signup'));

    // ── Toggle password visibility (all toggle buttons) ──
    document.querySelectorAll('.toggle-password').forEach(btn => {
      btn.addEventListener('click', () => {
        const input    = document.getElementById(btn.dataset.target);
        const eyeOpen  = btn.querySelector('.eye-open');
        const eyeClose = btn.querySelector('.eye-closed');
        const isPw     = input.type === 'password';
        input.type            = isPw ? 'text' : 'password';
        eyeOpen.style.display  = isPw ? 'none' : 'block';
        eyeClose.style.display = isPw ? 'block' : 'none';
      });
    });
  </script>

</body>
</html>
