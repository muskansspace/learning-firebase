<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Welcome to your dashboard — see your user number." />
  <title>Home — Dashboard</title>
  <link rel="stylesheet" href="homePage.css" />
</head>
<body>

  <!-- ── Background ───────────────────────────────── -->
  <div class="bg-canvas">
    <div class="orb orb--1"></div>
    <div class="orb orb--2"></div>
    <div class="orb orb--3"></div>
  </div>

  <!-- ── Page Wrapper ─────────────────────────────── -->
  <div class="home-wrapper">

    <!-- Top Bar -->
    <nav class="topbar">
      <a href="homePage.html" class="topbar-brand">
        <div class="topbar-logo">
          <svg viewBox="0 0 24 24">
            <path d="M12 2L2 7l10 5 10-5-10-5z" />
            <path d="M2 17l10 5 10-5" />
            <path d="M2 12l10 5 10-5" />
          </svg>
        </div>
        <span class="topbar-name">MyApp</span>
      </a>

      <button type="button" class="btn-logout" id="logoutButton">
      <svg viewBox="0 0 24 24">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
        <polyline points="16 17 21 12 16 7" />
        <line x1="21" y1="12" x2="9" y2="12" />
      </svg>
      Logout
    </button>
    </nav>

    <!-- Hero -->
    <main class="hero">

      <p class="greeting">Welcome aboard 🎉</p>

      <!-- Spinning User Number Badge -->
      <div class="user-badge">
        <div class="user-number-ring">
          <div class="user-number-inner">
            <span class="user-number-label">User No.</span>
            <span class="user-number-value" id="userNumber">1</span>
          </div>
        </div>
      </div>

      <h1 class="hero-title">
        You are <span class="highlight">User No. <span id="userNumberText">1</span></span>
      </h1>
      <p class="hero-subtitle">
        You've joined our growing community. Your unique number is proudly reserved just for you!
      </p>

      <!-- Stats -->
      <div class="stats-row">
        <div class="stat-card">
          <div class="stat-icon stat-icon--pink">
            <svg viewBox="0 0 24 24">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
              <circle cx="9" cy="7" r="4" />
              <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
              <path d="M16 3.13a4 4 0 0 1 0 7.75" />
            </svg>
          </div>
          <div class="stat-value" id="totalUsers">1</div>
          <div class="stat-label">Total Users</div>
        </div>

        <div class="stat-card">
          <div class="stat-icon stat-icon--purple">
            <svg viewBox="0 0 24 24">
              <polyline points="22 12 18 12 15 21 9 3 6 12 2 12" />
            </svg>
          </div>
          <div class="stat-value">Active</div>
          <div class="stat-label">Status</div>
        </div>

        <div class="stat-card">
          <div class="stat-icon stat-icon--lavender">
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="10" />
              <polyline points="12 6 12 12 16 14" />
            </svg>
          </div>
          <div class="stat-value" id="joinDate">—</div>
          <div class="stat-label">Joined</div>
        </div>
      </div>

    </main>
  </div>

  <!-- ── Script ───────────────────────────────────── -->
  <script type="module" src="homePage.js"></script>

</body>
</html>
